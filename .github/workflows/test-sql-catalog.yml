name: Test SQL Catalog Reusable
on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Name of the DuckDB-Iceberg artifact to download"
        required: true
        type: string

jobs:
  test-sql-catalog:
    name: Test SQL catalog in DuckDB and SQLite databases, and the filesystem catalog
    runs-on: ubuntu-latest
    env:
      ASAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=0:external_symbolizer_path=/usr/bin/llvm-symbolizer
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/.combined-sanitizer-leak-suppressions.txt
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          path: build

      - name: Extract build artifact
        run: tar -xzf build/relassert-artifact.tar.gz -C build

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Prepare sanitizer support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm
          cat duckdb/.sanitizer-leak-suppressions.txt .sanitizer-leak-suppressions.txt > .combined-sanitizer-leak-suppressions.txt

      - name: Run SQL catalog tests (DuckDB database file)
        run: make test_sql_catalog_relassert

      - name: Run SQL catalog tests (SQLite)
        run: make test_sql_catalog_sqlite_relassert

      - name: Run filesystem catalog tests
        run: make test_filesystem_catalog_relassert

      - name: Run PyIceberg interoperability tests
        run: |
          python3 -m pip install "pyiceberg[sql-sqlite,pyarrow]==0.11.1" pytest packaging
          make test_sql_catalog_python_relassert

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sql-catalog-diagnostics
          path: duckdb_unittest_tempdir
          if-no-files-found: ignore
          retention-days: 3

  test-sql-catalog-postgres:
    name: Test SQL catalog in PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: iceberg_catalog
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iceberg_catalog"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      # The PostgreSQL client library (vcpkg port libpq) is built with bison and flex
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bison flex ninja-build

      - name: Build (release, with postgres_scanner)
        uses: duckdb/duckdb-ci/build-duckdb@main
        env:
          GEN: ninja
          ICEBERG_SQL_CATALOG_POSTGRES: 1
        with:
          build-type: release
          build: python3 duckdb/scripts/ci/retry.py -- make release
          vcpkg-commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24

      - name: Run SQL catalog tests (PostgreSQL)
        run: make test_sql_catalog_postgres_release

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sql-catalog-postgres-diagnostics
          path: duckdb_unittest_tempdir
          if-no-files-found: ignore
          retention-days: 3
